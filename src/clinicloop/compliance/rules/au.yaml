    queue: clinical_urgent
    target_response_minutes: 15
    value_source: assumed
  - category: pregnancy
    queue: prescriber_review
    target_response_minutes: 60
    value_source: assumed
  - category: clinical_advice
    queue: prescriber_review
    target_response_minutes: 240
    value_source: assumed

rules:
