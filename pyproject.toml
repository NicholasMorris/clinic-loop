[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicloop"
version = "0.1.0"
description = "Clinical workflow automation with LangGraph agents, synthetic audio, and integrity signals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
]

# The manifest names libraries only. Versions are resolved and recorded in uv.lock.
[project.optional-dependencies]
sim = [
    "numpy",
    "pydantic",
    "streamlit",
]
api = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-awesome-nav",
]
agents = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-openai",
    "pydantic",
]
audio = [
    "numpy",
    "soundfile",
    "silero-vad",
    "speechbrain",
]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
    "mypy",
    "types-PyYAML",
    "towncrier",
    "packaging",
    "httpx",
]

[project.scripts]
clinicloop-doctor = "clinicloop.setup.doctor:main"
clinicloop-install = "clinicloop.setup.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinicloop = ["py.typed"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Third-party libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["soundfile", "silero_vad", "speechbrain", "speechbrain.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
title_format = "Version {version}"

[tool.towncrier.fragment.feat]
name = "Features"

[tool.towncrier.fragment.fix]
name = "Fixes"

[tool.towncrier.fragment.docs]
name = "Documentation"

[tool.towncrier.fragment.chore]
name = "Chores"

[tool.towncrier.fragment.test]
name = "Tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "local_model: needs the local model server and is excluded from make ci",
    "checklist_id: requirement identifier for conformance test coverage",
    "conformance: conformance test for requirement",
    "conformance_M1_8: conformance test for M1-8",
]
