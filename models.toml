# LM Studio local model configuration.
# All rows use loopback addresses only (127.0.0.1, ::1, or localhost).
# Server rows are pinned to exact HuggingFace repo IDs, revisions, and quantisations.
# The rows match the model-selection ADR (docs/adr/llm-model-selection.md): primary qwen,
# judge gemma, fallback gpt_oss. Each revision is the repo head commit fetched from the
# Hugging Face API on 2026-09-22; every repo was last modified before the local download
# (2025-07-31, 2026-07-23, 2026-03-19), so the head equals what LM Studio fetched.
# The fake row requires no server fields and is used for offline testing.

[primary]
kind = "server"
repo_id = "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF"
revision = "eea7b2be5805a5f151f8847ede8e5f9a9284bf77"
quant = "Q4_K_M"
family = "qwen"
base_url = "http://127.0.0.1:1234/v1"
structured_method = "tools"
parallel_tool_calls = true
reasoning_handling = "enabled"
context_window = 8000
temperature = 0.7
seed = 42

